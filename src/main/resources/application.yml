spring:
  application:
    name: recon
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:recon}?connectionTimeZone=UTC
    username: ${DB_USERNAME:recon}
    password: ${DB_PASSWORD:recon}
    hikari:
      data-source-properties:
        # Lets the MySQL driver send a JDBC batch as one multi-row INSERT.
        rewriteBatchedStatements: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Without these, requests wait up to a minute for Redis during an outage.
      timeout: 2s
      connect-timeout: 1s
  servlet:
    multipart:
      max-file-size: 50MB
      # Slightly above the file limit to leave room for multipart overhead.
      max-request-size: 51MB

server:
  tomcat:
    # Tomcat must read past the limit so the client receives a 413, not a reset connection.
    max-swallow-size: 100MB

recon:
  feed:
    idempotency-ttl: 24h
  matching:
    threads: 4
    # More chunks than threads, so a thread that finishes early can take more work.
    chunks: 16
  reconciliation:
    # Must be longer than the slowest run. A 546,000-row run takes about 5 seconds.
    lock-ttl: 10m
    summary-cache-ttl: 1h

springdoc:
  # Only list the error responses each endpoint declares, not every handler on every endpoint.
  override-with-generic-response: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
